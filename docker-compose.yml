services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fintrack_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fintrack-net

  # ── Mailpit (local dev SMTP sink) ───────────────────────────────────────────
  # Catches every e-mail the auth-service sends; read them at http://localhost:8025.
  # Nothing is delivered to real inboxes. Do not use in production.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP
    networks:
      - fintrack-net

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Needed to resolve com.fintrack:core from GitHub Packages during
        # the build — export these in your shell (or put in .env) first.
        GITHUB_ACTOR: ${GITHUB_ACTOR}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: fintrack/auth-service:latest
    restart: always
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/fintrack_auth
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # config-service (Eureka) runs in a separate repo/container — point this
      # at wherever it's reachable from this container (default: host machine).
      EUREKA_HOST: ${EUREKA_HOST:-host.docker.internal}
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      FINTRACK_JWT_SECRET: ${FINTRACK_JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      # SMTP for password-reset e-mails. Defaults to the bundled Mailpit container;
      # override all MAIL_* (and set MAIL_SMTP_AUTH/MAIL_STARTTLS=true) for a real provider.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@fintrack.local}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - fintrack-net

volumes:
  postgres_data:

networks:
  fintrack-net:
    driver: bridge
