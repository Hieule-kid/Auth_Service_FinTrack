server:
  port: 8081

spring:
  application:
    name: auth-service

  # ── PostgreSQL Data Source ────────────────────────────────────────────────
  datasource:
    # Override with env var: POSTGRES_URL
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/fintrack_auth}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep pool small for dev; tune for production
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ── Cache (Caffeine — in-memory, single-node) ─────────────────────────────
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      # use "validate" or "none" in production; "update" is fine for dev
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          # Use batch inserts for better write throughput
          batch_size: 25
        order_inserts: true
        order_updates: true

# ── Eureka Client ─────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka123}@${EUREKA_HOST:localhost}:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    initial-instance-info-replication-interval-seconds: 10
    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: false
    # On Render, override hostname so gateway can reach this service publicly.
    # Locally, RENDER_EXTERNAL_HOSTNAME is unset so it falls back to localhost.
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    non-secure-port: ${server.port}
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# ── JWT ───────────────────────────────────────────────────────────────────
# For localhost only, a shared development secret lets the services start
# without an environment file. Set FINTRACK_JWT_SECRET to an unpredictable
# 32+ character value in every deployed environment.
fintrack:
  jwt:
    secret: ${FINTRACK_JWT_SECRET:fintrack-local-development-jwt-secret-2026}
    # Access token: 15 minutes (900,000 ms)
    access-token-expiry-ms: ${FINTRACK_JWT_ACCESS_EXPIRY_MS:900000}
    # Refresh token TTL in days
    refresh-token-expiry-days: ${FINTRACK_JWT_REFRESH_EXPIRY_DAYS:7}

# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    com.fintrack.auth: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

# ── Swagger / SpringDoc ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Group endpoints by HTTP method for readability
    operations-sorter: method
    tags-sorter: alpha
    # Expand request bodies by default
    default-models-expand-depth: 2
    # Persist the Authorization header between page reloads
    persist-authorization: true
    # Disable the "Try it out" toggle so it's always enabled
    try-it-out-enabled: true
